generations:
  - name: "First Generation (Mk I)"
    start_year: 1982
    end_year: 1987
    description: "The original Ford Sierra represented a radical departure from its predecessor, the Cortina/Taunus, featuring aerodynamic 'jelly mould' styling that was initially controversial but ultimately influential. Available in hatchback and estate (wagon) body styles, the four-door Sapphire sedan was introduced alongside this generation in 1987. It was Ford's mainstream family car for Europe, primarily rear-wheel drive when competitors were largely adopting front-wheel drive. Engine options included various 'Pinto' four-cylinder petrol engines, the Cologne V6, and diesel options. Performance variants included the XR4i with its distinctive biplane rear spoiler and the limited-production RS Cosworth, which established a motorsport legacy. The bold styling initially faced consumer resistance but was later accepted for its modern approach."

  - name: "Second Generation (Mk II)"
    start_year: 1987
    end_year: 1990
    description: "The facelifted Sierra featured completely revised styling with more conventional headlights replacing the original's flush units, a modified front end with indicators now positioned above the bumper, and larger side windows. The Sierra Sapphire four-door saloon was officially introduced at this time for the UK market alongside existing hatchback and estate models. This generation consolidated the Sierra's position as a mainstream family car while expanding its performance credentials through the RS Cosworth variant. The rear-wheel drive layout was retained on most models, with four-wheel drive available on XR4x4 variants. Interior received quality improvements and updated technology features, including the option of new engines like the 1.8-litre 'lean burn' petrol engine."

  - name: "Second Generation (Mk II Facelift)"
    start_year: 1990
    end_year: 1993
    description: "The final phase of Sierra production received minor updates including smoked rear lamp lenses introduced in 1990 model year, dashboard redesign with a new instrument surround mirroring the look of the new-generation Escort and Orion, updated steering wheels, and run-out special editions like 'Azure' and 'Chausseur'. The 1.6L CVH, 1.8 CVH and 2.0L DOHC petrol models became available with catalytic converter options before their adoption became compulsory at end of 1992. This marked the final usage of the venerable Pinto engine in a Ford of Europe passenger car. The Sierra Cosworth continued its motorsport success with four-wheel-drive versions from January 1990. Production ended in December 1992 as the Genk factory switched to Mondeo production, with stocks lasting into 1994. Approximately 2.7 million Sierras were sold over its lifetime, making it one of Ford Europe's most significant models."